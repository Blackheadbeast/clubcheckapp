            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Memberships
      summary: Start a membership
      security:
        - ApiKey:
            - memberships:write
      x-scope: memberships:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - memberId
                - planId
              properties:
                memberId:
                  type: string
                  description: Opaque identifier
                planId:
                  type: string
                  description: Opaque identifier
                startDate:
                  type: string
                  format: date-time
                paymentMethod:
                  type: string
                  enum:
                    - card
                    - ach
                    - cash
                    - check
                    - other
                  default: other
                discountPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
                couponCode:
                  type: string
                collectNow:
                  type: boolean
                  description: Charge the saved card or bank account now (card and ach only)
                skipTrial:
                  type: boolean
                locationId:
                  type:
                    - string
                    - 'null'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Membership'
                      - type: object
                        properties:
                          invoice:
                            oneOf:
                              - $ref: '#/components/schemas/Invoice'
                              - type: 'null'
                          charge:
                            type:
                              - object
                              - 'null'
                            properties:
                              status:
                                type: string
                              message:
                                type:
                                  - string
                                  - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/RuleRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
