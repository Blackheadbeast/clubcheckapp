webhooks:
  event:
    post:
      summary: An event from ClubCheck
      description: >-
        Sent to each webhook endpoint subscribed to the event's type. Types: member.created, member.updated, member.archived, membership.created,
        membership.updated, membership.cancelled, membership.frozen, membership.resumed, booking.created, booking.updated, booking.cancelled,
        booking.checked_in, appointment.created, appointment.updated, appointment.cancelled, appointment.completed, appointment.no_show, payment.succeeded,
        payment.failed, payment.refunded, invoice.created, invoice.paid, invoice.failed, workout.completed, program.assigned, program.completed, lead.created,
        lead.updated, and webhook.test. Answer any 2xx within 10 seconds. Retries carry the same event ID and body.
      parameters:
        - name: ClubCheck-Event-Id
          in: header
          required: true
          schema:
            type: string
          description: Same as the body's id
        - name: ClubCheck-Event-Type
          in: header
          required: true
          schema:
            type: string
            enum:
              - member.created
              - member.updated
              - member.archived
              - membership.created
              - membership.updated
              - membership.cancelled
              - membership.frozen
              - membership.resumed
              - booking.created
              - booking.updated
              - booking.cancelled
              - booking.checked_in
              - appointment.created
              - appointment.updated
              - appointment.cancelled
              - appointment.completed
              - appointment.no_show
              - payment.succeeded
              - payment.failed
              - payment.refunded
              - invoice.created
              - invoice.paid
              - invoice.failed
              - workout.completed
              - program.assigned
              - program.completed
              - lead.created
              - lead.updated
              - webhook.test
        - name: ClubCheck-Delivery-Id
          in: header
          required: true
          schema:
            type: string
        - name: ClubCheck-Timestamp
          in: header
          required: true
          schema:
            type: integer
          description: Unix seconds when this attempt was sent
        - name: ClubCheck-Signature
          in: header
          required: true
          schema:
            type: string
            example: v1=5f2b…
          description: v1= followed by hex HMAC-SHA256 of "<timestamp>.<raw body>" under the endpoint's signing secret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Received. Any 2xx counts.
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: cc_live_…
      description: An API key created in Settings → Developer / API. Each operation lists the scope it needs under x-scope.
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Larger values are treated as 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 200
      description: 'Unique per operation. A repeat with the same key and body returns the first response with Idempotent-Replayed: true.'
  headers:
    X-Request-Id:
      description: Identifies this request. Quote it when reporting a problem.
      schema:
        type: string
    X-RateLimit-Limit:
      description: Requests allowed in the current one-minute window
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests left in the window
      schema:
        type: integer
    X-RateLimit-Reset:
      description: When the window ends, Unix seconds
      schema:
        type: integer
  responses:
    BadRequest:
      description: 'The request is wrong: validation_error, invalid_json, invalid_parameter'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: missing_api_key, invalid_api_key, api_key_revoked or api_key_expired
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: insufficient_scope, or the gym's subscription does not allow changes
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource in this gym
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Conflicts with the current state: duplicate_email, idempotency_key_reused, request_in_progress'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RuleRefused:
      description: A booking, appointment or membership rule refused it; the code names the rule
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: rate_limited
      headers:
        Retry-After:
          description: Seconds to wait
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: Stable, machine-readable
            message:
              type: string
              description: For people; may be reworded
            requestId:
              type: string
              example: req_3f9a1c0b7d2e4f6a8b1c2d3e
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
