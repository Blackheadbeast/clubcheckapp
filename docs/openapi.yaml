# Generated to match app/api/v1. tests/public-api.test.ts checks that every path and method here exists and none is missing.
openapi: 3.1.0
info:
  title: ClubCheck Public API
  version: 1.0.0
  description: >-
    REST API and webhooks for connecting other software to one ClubCheck gym. See PUBLIC-API.md for the guide: authentication, scopes, pagination, rate limits,
    idempotency and webhook signature verification.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: YOUR-CLUBCHECK-DOMAIN
        description: The domain your ClubCheck account is served from
tags:
  - name: Meta
  - name: Members
  - name: Memberships
  - name: Classes
  - name: Bookings
  - name: Appointments
  - name: Attendance
  - name: Payments
  - name: Invoices
  - name: Workouts
  - name: Programs
  - name: Leads
security:
  - ApiKey: []
paths:
  /:
    get:
      tags:
        - Meta
      summary: Who this key is
      security:
        - ApiKey: []
      x-scope: null
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      object:
                        type: string
                        const: api_key_info
                      apiVersion:
                        type: string
                      gym:
                        type: object
                        properties:
                          name:
                            type:
                              - string
                              - 'null'
                          timezone:
                            type: string
                          currency:
                            type: string
                      key:
                        type: object
                        properties:
                          name:
                            type: string
                          scopes:
                            type: array
                            items:
                              type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /members:
    get:
      tags:
        - Members
      summary: List members
      security:
        - ApiKey:
            - members:read
      x-scope: members:read
      parameters:
        - name: updatedSince
          in: query
          description: Changed at or after. Orders results oldest change first
          schema:
            type: string
            format: date-time
        - name: createdSince
          in: query
          description: Created at or after
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          description: 'One of: active, trial, past_due, frozen, cancelled, inactive'
          schema:
            type: string
            enum:
              - active
              - trial
              - past_due
              - frozen
              - cancelled
              - inactive
        - name: locationId
          in: query
          description: Home location
          schema:
            type: string
        - name: email
          in: query
          description: Exact email address
          schema:
            type: string
        - name: search
          in: query
          description: Name, email or phone
          schema:
            type: string
        - name: archived
          in: query
          description: Default false
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
              - all
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
        - Members
      summary: Create a member
      security:
        - ApiKey:
            - members:write
      x-scope: members:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MemberInput'
                - required:
                    - name
                    - email
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /members/{id}:
    get:
      tags:
        - Members
      summary: Read a member
      security:
        - ApiKey:
            - members:read
      x-scope: members:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
