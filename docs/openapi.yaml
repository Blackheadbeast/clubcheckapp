  /memberships/{id}/{action}:
    post:
      tags:
        - Memberships
      summary: Freeze, unfreeze, cancel, resume or change the plan of a membership
      security:
        - ApiKey:
            - memberships:write
      x-scope: memberships:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum:
              - freeze
              - unfreeze
              - cancel
              - resume
              - change-plan
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  description: 'freeze: when it thaws'
                reason:
                  type:
                    - string
                    - 'null'
                when:
                  type: string
                  enum:
                    - now
                    - period_end
                  description: 'cancel: required'
                planId:
                  type: string
                  description: 'change-plan: required'
                effective:
                  type: string
                  enum:
                    - now
                    - next_period
                  default: next_period
                preview:
                  type: boolean
                  description: 'change-plan: return the proration and change nothing'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Membership'
        '400':
